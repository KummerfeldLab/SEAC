on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: devel
      - uses: r-lib/actions/setup-bioconductor@v1
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::BiocCheck
          needs: check
      - name: Check
        uses: r-lib/actions/check-r-package@v2
      - name: BiocCheck
        run: Rscript -e 'BiocCheck::BiocCheck(".", `new-package` = TRUE)'
